name: Android Mini App contract

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'docs/specs/global-dandelion-miniapp-contract.md'
      - '.github/workflows/miniapp-contract-ci.yml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'mobile/android/**'
      - 'docs/specs/global-dandelion-miniapp-contract.md'
      - '.github/workflows/miniapp-contract-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
