name: Android migration documentation
on:
  push:
    branches:
      - 'spec/grok-bot-018-android-parity-20260922'
    paths:
      - 'docs/android-port/**'
      - 'docs/specs/desktop-main-android-full-parity.md'
      - 'ANDROID_PORT.md'
      - 'scripts/android-port-docs.py'
      - 'scripts/check_grok_android_parity.py'
      - 'tests/test_parity_checker.py'
      - 'tests/test_android_port_docs_generator.py'
      - '.github/workflows/android-port-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: android-port-docs-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  source-inventory:
    name: Pinned Desktop complete source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact Android checkout provenance
        env:
          ANDROID_PR_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANDROID_PR_HEAD_SHA"
      - name: Run Android source-authority generator regression
        run: python3 -m unittest tests.test_android_port_docs_generator
      - name: Rebaseline persistent source authority in Actions worktree
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_PR_HEAD_SHA: ${{ github.sha }}
          ANDROID_PR_HEAD_REF: ${{ github.ref_name }}
          ANDROID_PR_NUMBER: '3'
          ANDROID_PR_BASE_SHA: ''
          ANDROID_PR_BASE_REF: 'main'
          ANDROID_RESPONSIBILITY_PREDECESSOR_ARTIFACT: '12053467058'
          ANDROID_RESPONSIBILITY_PREDECESSOR_ARTIFACT_DIGEST: 'sha256:26fe89b6a05f76ce96ab5ddab5a6107251586ad8143f42fff0d4794a4da15eb5'
        run: python3 scripts/android-port-docs.py rebaseline
      - name: Enumerate source and verify authority
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_PR_HEAD_SHA: ${{ github.sha }}
          ANDROID_PR_HEAD_REF: ${{ github.ref_name }}
          ANDROID_PR_NUMBER: '3'
          ANDROID_PR_BASE_SHA: ''
          ANDROID_PR_BASE_REF: 'main'
        run: python3 scripts/android-port-docs.py inventory
      - name: Verify generated exact authority bookkeeping
        run: |
          set -euo pipefail
          EXPECTED_ANDROID_HEAD="$(git rev-parse HEAD)"
          test "$(wc -l < docs/android-port/authority/source-inventory-ledger.jsonl)" -eq 8258
          python3 - "$EXPECTED_ANDROID_HEAD" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          expected=sys.argv[1]
          m=json.loads(Path('docs/android-port/authority/source-inventory-manifest.json').read_text(encoding='utf-8'))
          ledger_bytes=Path('docs/android-port/authority/source-inventory-ledger.jsonl').read_bytes()
          rows=[json.loads(line) for line in ledger_bytes.decode('utf-8').splitlines() if line.strip()]
          assert hashlib.sha256(ledger_bytes).hexdigest()==m['ledger_sha256']
          assert m['desktop_commit']=='12a4e29819592e3a7e32f7435cb0cf2e3cc53848'
          assert m['source_commit']==m['desktop_commit']
          assert m['desktop_root_tree']=='72fc5f777012f6e7bf5f5f471b6f121fd3612bb2'
          assert m['tracked_non_tree_entries']==8258 and len(rows)==8258
          assert m['tree_entries']==9412
          for field in ('android_pr_head_sha','android_tested_checkout_sha','workflow_sha'):
            assert m[field]==expected, (field,m[field],expected)
          assert len({row['source_path'] for row in rows})==8258
          for row in rows:
            assert row['source_commit']==m['desktop_commit']
            assert row['source_blob_sha'] and row['source_mode'] and row['source_type']
            assert row['android_pr_head_sha']==expected
            assert row['android_tested_checkout_sha']==expected
            assert row['workflow_sha']==expected
            assert row['implementation_status']=='unreviewed'
            assert row['verification_status']=='not-verified'
          r=json.loads(Path('docs/android-port/authority/responsibility-ledger.json').read_text(encoding='utf-8'))
          assert r['source_commit']==m['desktop_commit']
          for field in ('android_pr_head_sha','android_tested_checkout_sha','workflow_sha'):
            assert r[field]==expected, (field,r[field],expected)
          responsibilities=r.get('responsibilities',[])
          ids=[item.get('responsibility_id') for item in responsibilities]
          assert len(responsibilities)==306 and len(set(ids))==306
          for item in responsibilities:
            assert item['source_commit']==m['desktop_commit']
            assert item['android_head_at_update']==expected
            assert item['implementation_status']=='unreviewed'
            assert item['verification_status']=='not-verified'
            for source in item.get('desktop_sources',[]):
              row=next(row for row in rows if row['source_path']==source['path'])
              assert source['source_commit']==m['desktop_commit']
              assert source['blob_sha']==row['source_blob_sha']
              assert source['source_mode']==row['source_mode']
              assert source['source_type']==row['source_type']
          coverage=json.loads(Path('docs/android-port/generated/packages-semantic-coverage.json').read_text(encoding='utf-8'))
          package_rows=[row for row in rows if row['source_path'].startswith('source/packages/')]
          assert len(package_rows)==852
          assert coverage['expected_source_rows']==852 and coverage['observed_source_rows']==852
          assert coverage['complete_rows'] + coverage['strict_incomplete_rows'] == 852
          assert coverage['strict_incomplete_rows'] == sum(row.get('package_semantic_coverage_status') == 'incomplete' for row in package_rows)
          assert coverage['complete_rows'] == sum(row.get('package_semantic_coverage_status') == 'complete' for row in package_rows)
          assert all(row.get('package_semantic_coverage_status') in ('complete','incomplete') for row in package_rows)
          assert coverage['status'] == ('passed' if coverage['strict_incomplete_rows'] == 0 else 'incomplete')
          for key in ('semantic_responsibility_rows','real_source_owner_rows','real_android_owner_rows','valid_android_target_rows','valid_disposition_rows'):
            assert 0 <= coverage[key] <= 852, (key,coverage[key])
          rejected=json.loads(Path('docs/android-port/generated/rejected-android-targets.json').read_text(encoding='utf-8'))
          assert rejected['count']==len(rejected['rejected_targets'])
          assert rejected['status']==('incomplete' if rejected['count'] else 'passed')
          print(json.dumps({
            'android_head':expected,
            'desktop_commit':m['desktop_commit'],
            'tree_entries':m['tree_entries'],
            'tracked_non_tree_entries':m['tracked_non_tree_entries'],
            'ledger_sha256':m['ledger_sha256'],
            'responsibility_count':len(responsibilities),
            'package_semantic_coverage':{k:v for k,v in coverage.items() if k!='gaps'},
            'rejected_android_target_count':rejected['count'],
          }, sort_keys=True))
          PY
      - name: Commit regenerated exact-main authority to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --format=%s)" == "chore(android): persist exact Desktop main authority evidence" ]]; then
            echo "Persistence commit detected; exact-current-head evidence is retained in this run artifact without creating a commit loop."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-port/authority/baseline.json \
            docs/android-port/authority/source-inventory-manifest.json \
            docs/android-port/authority/responsibility-ledger.json \
            docs/android-port/authority/source-inventory-ledger.jsonl \
            docs/android-port/generated/packages-semantic-coverage.json \
            docs/android-port/generated/rejected-android-targets.json \
            docs/android-port/generated/responsibility-mapping-summary.json \
            docs/android-port/generated/unmapped-source-rows.json \
            docs/android-port/generated/source-manifest.json \
            docs/android-port/generated/rebaseline-summary.json
          if git diff --cached --quiet; then
            echo "No regenerated authority changes to commit."
            exit 0
          fi
          git commit -m "chore(android): persist exact Desktop main authority evidence"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          NEW_HEAD="$(git rev-parse HEAD)"
          echo "Persisted authority at exact Android HEAD ${NEW_HEAD}"
          gh workflow run grok-android-architecture.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run android-parity-full-ci.yml --ref "${GITHUB_REF_NAME}"
          # GITHUB_TOKEN pushes do not trigger another push workflow. Explicitly re-run
          # documentation on the persistence commit so its artifact captures that exact
          # checkout. The next run sees this persistence commit and skips another commit.
          gh workflow run android-port-docs.yml --ref "${GITHUB_REF_NAME}"
      - name: Package documentation and source evidence
        if: always()
        run: python3 scripts/android-port-docs.py bundle
      - name: Upload source inventory and documentation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-port-source-and-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/android-port/authority/baseline.json
            docs/android-port/authority/source-inventory-manifest.json
            docs/android-port/authority/source-inventory-ledger.jsonl
            docs/android-port/authority/responsibility-ledger.json
            docs/android-port/generated/
            android-port-documentation.zip
            android-port-documentation.zip.sha256
          if-no-files-found: error
          retention-days: 30
  documentation-contract:
    name: Documentation completeness and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate documentation completeness
        run: python3 scripts/android-port-docs.py validate
      - name: Assert documentation validation report exists
        run: test -s docs/android-port/generated/docs-validation.json
      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-port-docs-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/android-port/generated/docs-validation.json
          if-no-files-found: error
          retention-days: 30
