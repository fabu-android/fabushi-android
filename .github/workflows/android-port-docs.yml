name: Android migration documentation
on:
  pull_request:
    paths:
      - 'docs/android-port/**'
      - 'docs/specs/desktop-main-android-full-parity.md'
      - 'ANDROID_PORT.md'
      - 'scripts/android-port-docs.py'
      - '.github/workflows/android-port-docs.yml'
  push:
    branches: ['spec/grok-bot-018-android-parity-20260922']
    paths:
      - 'docs/android-port/**'
      - 'docs/specs/desktop-main-android-full-parity.md'
      - 'ANDROID_PORT.md'
      - 'scripts/android-port-docs.py'
      - '.github/workflows/android-port-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-port-docs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-inventory:
    name: Pinned Desktop complete source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Rebaseline persistent source authority in Actions worktree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android-port-docs.py rebaseline
      - name: Enumerate source and verify authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android-port-docs.py inventory
      - name: Commit regenerated exact-main authority manifest
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(wc -l < docs/android-port/authority/source-inventory-ledger.jsonl)" -eq 8258
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/android-port/authority/responsibility-ledger.json').read_text(encoding='utf-8'))
          assert len(data.get('responsibilities', [])) == 306
          assert data.get('authority', {}).get('desktop_commit') == '12a4e29819592e3a7e32f7435cb0cf2e3cc53848'
          assert data.get('authority', {}).get('desktop_root_tree') == '72fc5f777012f6e7bf5f5f471b6f121fd3612bb2'
          PY
          test -s docs/android-port/authority/responsibility-ledger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/android-port/authority/responsibility-ledger.json').read_text(encoding='utf-8'))
          assert len(data.get('responsibilities', [])) == 306
          assert data.get('authority', {}).get('desktop_commit') == '12a4e29819592e3a7e32f7435cb0cf2e3cc53848'
          assert data.get('authority', {}).get('desktop_root_tree') == '72fc5f777012f6e7bf5f5f471b6f121fd3612bb2'
          PY
          git add docs/android-port/authority/baseline.json docs/android-port/authority/source-inventory-manifest.json docs/android-port/authority/responsibility-ledger.json docs/android-port/authority/source-inventory-ledger.jsonl
          if git diff --cached --quiet; then
            echo "No regenerated authority changes to commit."
            exit 0
          fi
          git commit -m "chore(android): persist exact Desktop main authority evidence"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
      - name: Package documentation and source evidence
        if: always()
        run: python3 scripts/android-port-docs.py bundle
      - name: Upload source inventory and documentation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-port-source-and-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/android-port/authority/baseline.json
            docs/android-port/authority/source-inventory-manifest.json
            docs/android-port/authority/source-inventory-ledger.jsonl
            docs/android-port/authority/responsibility-ledger.json
            docs/android-port/generated/
            android-port-documentation.zip
            android-port-documentation.zip.sha256
          if-no-files-found: error
          retention-days: 30
  documentation-contract:
    name: Documentation completeness and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate documentation completeness
        run: python3 scripts/android-port-docs.py validate
      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-port-docs-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/android-port/generated/docs-validation.json
          if-no-files-found: error
          retention-days: 30
