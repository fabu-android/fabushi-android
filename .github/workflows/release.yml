name: Release Android APKs

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.1.0)"
        required: true
        type: string
      version_code:
        description: "Optional monotonic Android versionCode override (leave empty to derive from semver tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release-android:
    name: Build, Sign & Publish Fabushi Telegram + Mika Android Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deterministic release version & monotonic versionCode
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VCODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          args=(
            scripts/package_android_release.py
            --resolve-release-metadata
            --tag="$TAG"
            --github-env="$GITHUB_ENV"
          )
          if [ -n "$INPUT_VCODE" ]; then
            args+=(--version-code="$INPUT_VCODE")
          fi
          python3 "${args[@]}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK 27
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 platforms;android-36 build-tools;37.0.0 build-tools;36.0.0 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Set up Rust stable & Android cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/android/rust/mahayana_android_host
          cache-on-failure: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 16KB-aligned Rust JNI Libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_API_LEVEL: "29"
        run: bash scripts/build_rust_android.sh

      - name: Materialize Optional Signing Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            chmod 700 "$RUNNER_TEMP/keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run Test Gate & Build Release + GitHubRelease APKs
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m" \
            -PversionName="$RELEASE_VER" \
            -PversionCode="$RELEASE_VCODE" \
            -PgitHash="$RELEASE_TAG" \
            :mika-core:test \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace
          ./gradlew \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m" \
            -PversionName="$RELEASE_VER" \
            -PversionCode="$RELEASE_VCODE" \
            -PgitHash="$RELEASE_TAG" \
            :app:assembleRelease \
            --stacktrace
          ./gradlew \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m" \
            -PversionName="$RELEASE_VER" \
            -PversionCode="$RELEASE_VCODE" \
            -PgitHash="$RELEASE_TAG" \
            :app:assembleGithubRelease \
            --stacktrace

      - name: Package, Sign, Verify 16KB Alignment & Generate Update Manifest
        env:
          GH_REPOSITORY: ${{ github.repository }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/package_android_release.py \
            --repository="$GH_REPOSITORY" \
            --tag="$RELEASE_TAG" \
            --version="$RELEASE_VER" \
            --version-code="$RELEASE_VCODE"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-telegram-mika-android-${{ env.RELEASE_TAG }}
          path: |
            dist/*.apk
            dist/fabushi-android-update.json
            dist/SHA256SUMS
          retention-days: 30

      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Fabushi Telegram + Mika Android ${RELEASE_TAG}" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.apk dist/fabushi-android-update.json dist/SHA256SUMS --clobber
