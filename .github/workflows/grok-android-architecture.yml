name: Grok Android Architecture

on:
  push:
    branches:
      - spec/grok-bot-018-android-parity-20260922
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest exact HEAD runnable for this workflow/PR. Superseded SHAs are
# predecessor evidence and must not consume the runner queue ahead of current acceptance.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  agent-kv-exact-head-evidence:
    name: agent-kv-exact-head-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK for agent-kv production evidence
        run: |
          set -euo pipefail
          NDK_PACKAGE='ndk;28.2.13676358'
          NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          NDK_CLANG="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          for attempt in 1 2 3; do
            if sdkmanager "$NDK_PACKAGE" && test -x "$NDK_CLANG"; then
              exit 0
            fi
            rm -rf "$NDK_HOME" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Install cargo-ndk for agent-kv production evidence
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked
      - name: Build exact-HEAD agent-kv production owners
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf evidence/agent-kv-jni
          cargo ndk -t arm64-v8a -o evidence/agent-kv-jni build --release -p fabushi-android-host-jni
          test -s evidence/agent-kv-jni/arm64-v8a/libmahayana_app_host.so
      - name: Test exact-HEAD agent-kv production owners
        run: |
          set -euo pipefail
          cargo test -p fabushi-android-agent-kv --all-targets
      - name: Verify exact-HEAD agent-core interaction production owner
        run: |
          set -euo pipefail
          test -s evidence/agent-kv-jni/arm64-v8a/libmahayana_app_host.so
          grep -Fq 'pub struct InteractionQuery' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'pub struct InteractionResponse' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'pub struct SharedAgentInteractionOwner' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'pub fn drain_post_turn' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'fabushi_constants::ask_question::is_ask_question_auto_answer_reason' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'fn should_receipt_ask_question_result' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'pub fn is_ask_question_auto_answer_reason' source/packages/constants/src/ask_question.rs
          grep -Fq 'prune_completed_async_receipts_from_transcript_window' source/host/src/runner/agent_v1_interaction.rs
          grep -Fq 'live_async_ask_question_original_tool_call_ids' source/host/src/extensions/transcript/transcript_store.rs
          grep -Fq 'native_dispatch_routes_interaction_post_turn_flush_through_coordinator_host' source/android-host-jni/src/lib.rs
      - name: Test exact-HEAD agent-core interaction production owner
        run: |
          set -euo pipefail
          cargo test -p fabushi-mahayana-host generated_compatible_interaction_query_response_wire_roundtrip -- --nocapture
          cargo test -p fabushi-mahayana-host run_async_completion_is_enqueued_and_privacy_projection_is_redacted -- --nocapture
          cargo test -p fabushi-mahayana-host stale_account_and_process_epoch_responses_fail_closed -- --nocapture
          cargo test -p fabushi-mahayana-host android_json_host_settles_generated_ask_question_response_with_exact_fence -- --nocapture
          cargo test -p fabushi-mahayana-host android_json_host_rejects_stale_interaction_response_after_account_or_process_change -- --nocapture
          cargo test -p fabushi-constants ask_question::tests::structured_identity_round_trips_and_legacy_prefix_remains_recognized -- --exact
          cargo test -p fabushi-mahayana-host structured_and_legacy_auto_answer_rejections_do_not_consume_the_completion_receipt_identity -- --nocapture
          cargo test -p fabushi-mahayana-host ordinary_async_success_error_and_user_rejection_consume_completion_receipts -- --nocapture
          cargo test -p fabushi-mahayana-host duplicate_sync_settlement_is_rejected_without_replacing_the_first_result -- --nocapture
          cargo test -p fabushi-mahayana-host completed_receipts_follow_the_live_window_while_pending_receipts_are_preserved -- --nocapture
          cargo test -p fabushi-mahayana-host completed_receipt_deduplication_is_account_and_process_fenced -- --nocapture
          cargo test -p fabushi-mahayana-host async_ask_question_replay_window_is_account_agent_scoped_and_bounded -- --nocapture
          cargo test -p fabushi-mahayana-host live_async_ask_question_ids_follow_the_current_transcript_window_and_fallback -- --nocapture
          cargo test -p fabushi-android-host-jni native_dispatch_routes_interaction_post_turn_flush_through_coordinator_host -- --nocapture
      - name: Verify exact-HEAD background completion production owner
        run: |
          set -euo pipefail
          test -s evidence/agent-kv-jni/arm64-v8a/libmahayana_app_host.so
          grep -Fq 'pub const SYSTEM_NOTIFICATION_TAG: &str = "system_notification";' source/packages/constants/src/system_notification.rs
          grep -Fq 'pub const SYSTEM_NOTIFICATION_OPEN_TAG: &str = "<system_notification>";' source/packages/constants/src/system_notification.rs
          grep -Fq 'pub const SYSTEM_NOTIFICATION_CLOSE_TAG: &str = "</system_notification>";' source/packages/constants/src/system_notification.rs
          grep -Fq 'use fabushi_constants::system_notification::wrap_system_notification;' source/host/src/extensions/transcript/completion_revivals.rs
          grep -Fq 'wrap_system_notification(&neutralize_background_task_detail_close_tags(&body))' source/host/src/extensions/transcript/completion_revivals.rs
          grep -Fq '"text":build_shell_revival_prompt(completions)' source/host/src/android_json_runtime.rs
          grep -Fq '"requestSource":"background-shell-revival"' source/host/src/android_json_runtime.rs
          grep -Fq '"text":build_subagent_revival_prompt(completions)' source/host/src/android_json_runtime.rs
          grep -Fq '"requestSource":"cloud-agent-revival"' source/host/src/android_json_runtime.rs
          grep -Fq 'runtime: AndroidJsonHost' source/android-host-jni/src/lib.rs
      - name: Test exact-HEAD background completion production owner
        run: |
          set -euo pipefail
          cargo test -p fabushi-constants system_notification::tests::wrapper_is_recognizable_without_matching_partial_tags -- --exact
          cargo test -p fabushi-mahayana-host extensions::transcript::completion_revivals::tests::revival_prompts_use_canonical_system_notification_and_neutralize_nested_tags -- --exact
          cargo test -p fabushi-mahayana-host --test android_background_completion_shipping_contract -- --nocapture
          cargo test -p fabushi-android-host-jni tests::background_completion_hidden_turn_owner_is_linked_through_jni_android_json_host -- --exact

      - name: Verify exact-HEAD cloud-agent constants production owners
        run: |
          set -euo pipefail
          test -s evidence/agent-kv-jni/arm64-v8a/libmahayana_app_host.so
          grep -Fq 'CLOUD_AGENT_ARTIFACTS_DIR, ENV_SETUP_SKILL_ID' source/host/src/runner/android_system_prompt.rs
          grep -Fq 'name == "canvas" || name == ENV_SETUP_SKILL_ID' source/host/src/runner/android_system_prompt.rs
          grep -Fq 'sections.push(render_android_walkthrough_artifacts_system_prompt(None));' source/host/src/runner/android_system_prompt.rs
          grep -Fq 'build_android_root_system_instructions(' source/host/src/android_json_runtime.rs
          grep -Fq 'use fabushi_constants::cloud_agent::CLOUD_AGENT_SINGLE_REPO_WORKSPACE_ROOT;' source/box-exec-daemon/src/cloud_agent_production.rs
          grep -Fq 'snapshot_workspace_root_path: CLOUD_AGENT_SINGLE_REPO_WORKSPACE_ROOT.into(),' source/box-exec-daemon/src/cloud_agent_production.rs
          grep -Fq 'pub const ENV_SETUP_MANAGED_SKILL_DIRECTORY: &str = "/.cursor/skills-cursor/env-setup/";' source/packages/constants/src/cloud_agent.rs
          grep -Fq 'pub const ENV_SETUP_MANAGED_SKILL_PATH: &str = "/.cursor/skills-cursor/env-setup/SKILL.md";' source/packages/constants/src/cloud_agent.rs

          DESKTOP_AUTHORITY_SHA="$(python3 - <<'PY'
          import runpy
          print(runpy.run_path('scripts/android-port-docs.py')['EXPECTED_DESKTOP_COMMIT'])
          PY
          )"
          DESKTOP_DIR="$RUNNER_TEMP/desktop-cloud-agent-authority"
          rm -rf "$DESKTOP_DIR"
          git init -q "$DESKTOP_DIR"
          git -C "$DESKTOP_DIR" remote add origin https://github.com/bhrumom/fabushi-desktop.git
          git -C "$DESKTOP_DIR" fetch -q --depth=1 origin "$DESKTOP_AUTHORITY_SHA"
          git -C "$DESKTOP_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD)" = "$DESKTOP_AUTHORITY_SHA"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/constants/cloud-agent.ts)" = "7f42b8ea9c047959f422a63886931403d3da86ff"

          assert_symbol_count() {
            local symbol="$1"
            local expected="$2"
            mapfile -t matches < <(git -C "$DESKTOP_DIR" grep -n -F "$symbol" -- .)
            printf '%s\n' "${matches[@]}"
            test "${#matches[@]}" -eq "$expected"
          }
          assert_symbol_count ENV_SETUP_SKILL_ID 2
          assert_symbol_count ENV_SETUP_MANAGED_SKILL_DIRECTORY 2
          assert_symbol_count ENV_SETUP_MANAGED_SKILL_PATH 1
          assert_symbol_count CLOUD_AGENT_SINGLE_REPO_WORKSPACE_ROOT 1
          assert_symbol_count CLOUD_AGENT_ARTIFACTS_DIR 3
          grep -Fq 'import { CLOUD_AGENT_ARTIFACTS_DIR } from "../../constants/cloud-agent.js";' "$DESKTOP_DIR/source/packages/agent/prompts/shared.ts"
          grep -Fq 'resolvePromptArtifactsDir(props)' "$DESKTOP_DIR/source/packages/agent/prompts/testing/parent.ts"
          grep -Fq 'snapshot_workspace_root_path: "/workspace".into(),' "$DESKTOP_DIR/source/host/src/extensions/cloud_agents/cloud_agents_service.rs"
          grep -Fq 'matches!(skill_name(&item.full_path).as_str(), "canvas" | "env-setup")' "$DESKTOP_DIR/source/host/src/runner/system_prompt_assembly.rs"
      - name: Test exact-HEAD cloud-agent constants contracts
        run: |
          set -euo pipefail
          cargo test -p fabushi-constants cloud_agent::tests::constants_match_desktop_cloud_agent_contract -- --exact
          cargo test -p fabushi-mahayana-host runner::android_system_prompt::tests::env_setup_skill_uses_canonical_cloud_agent_identity_and_remains_protected -- --exact
          cargo test -p fabushi-mahayana-host runner::android_system_prompt::tests::walkthrough_artifact_directory_uses_canonical_cloud_agent_fallback_and_normalizes_override -- --exact
          cargo test -p fabushi-mahayana-host runner::android_system_prompt::tests::walkthrough_artifact_prompt_is_deduped_and_does_not_grant_capability -- --exact

      - name: Verify exact-HEAD environment-setup constants owner boundary
        run: |
          set -euo pipefail
          test -s evidence/agent-kv-jni/arm64-v8a/libmahayana_app_host.so
          grep -Fq 'pub mod environment_setup;' source/packages/constants/src/lib.rs
          grep -Fq 'use fabushi_constants::environment_setup::DEFAULT_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS;' source/host/src/extensions/experiments/extension.rs
          grep -Fq 'pub const ENVIRONMENT_SETUP_RESUME_CONFIG_NAME: &str = "environment_setup_resume_config";' source/host/src/extensions/experiments/extension.rs
          grep -Fq 'ENVIRONMENT_SETUP_RESUME_CONFIG_NAME => BTreeMap::from([' source/host/src/extensions/experiments/extension.rs
          grep -Fq '("max_resume_age_ms".into(), serde_json::json!(DEFAULT_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS))' source/host/src/extensions/experiments/extension.rs

          DESKTOP_AUTHORITY_SHA="$(python3 - <<'PY'
          import runpy
          print(runpy.run_path('scripts/android-port-docs.py')['EXPECTED_DESKTOP_COMMIT'])
          PY
          )"
          DESKTOP_DIR="$RUNNER_TEMP/desktop-environment-setup-authority"
          rm -rf "$DESKTOP_DIR"
          git init -q "$DESKTOP_DIR"
          git -C "$DESKTOP_DIR" remote add origin https://github.com/bhrumom/fabushi-desktop.git
          git -C "$DESKTOP_DIR" fetch -q --depth=1 origin "$DESKTOP_AUTHORITY_SHA"
          git -C "$DESKTOP_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD)" = "$DESKTOP_AUTHORITY_SHA"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/constants/environment-setup.ts)" = "2e6f6942f567476ea398f4f12da07e9490ca6dbb"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/shared/node/experiments/experiment-config.gen.ts)" = "b4ac08fbb9ec2bf6cccc77c1b1245e08d295ff5e"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/shared/node/experiments/cursor-experiments.ts)" = "b9f644e1795bccc5c27aacc5b0e90b5953409de9"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/electron-main/adapters/experiments.ts)" = "4cefd20a838019c34ac1e954ef5d6d86d223e013"
          assert_source_symbol_count() {
            local symbol="$1"
            local expected="$2"
            mapfile -t matches < <(git -C "$DESKTOP_DIR" grep -n -F "$symbol" -- source)
            printf '%s\n' "${matches[@]}"
            test "${#matches[@]}" -eq "$expected"
          }
          assert_source_symbol_count DEFAULT_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS 3
          assert_source_symbol_count MIN_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS 1
          assert_source_symbol_count MAX_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS 1
          assert_source_symbol_count environment_setup_resume_config 1
          grep -Fq 'max_resume_age_ms: DEFAULT_ENVIRONMENT_SETUP_MAX_RESUME_AGE_MS' "$DESKTOP_DIR/source/shared/node/experiments/experiment-config.gen.ts"
          grep -Fq 'for (const name of Object.keys(DYNAMIC_CONFIGS) as DynamicConfigName[]) dynamicConfigs[name] = this.getDynamicConfig(name);' "$DESKTOP_DIR/source/shared/node/experiments/cursor-experiments.ts"
          grep -Fq 'emitSnapshotChanged: (snapshot) => context.requireMainEdge().emit("experiments-changed", snapshot)' "$DESKTOP_DIR/source/electron-main/adapters/experiments.ts"
      - name: Test exact-HEAD environment-setup constants contracts
        run: |
          set -euo pipefail
          cargo test -p fabushi-constants environment_setup::tests::resume_age_policy_is_bounded -- --exact
          cargo test -p fabushi-mahayana-host extensions::experiments::extension::tests::environment_setup_resume_config_preserves_desktop_fallback_without_claiming_executor_enforcement -- --exact

      - name: Verify exact-HEAD git-diff constants declaration owner
        run: |
          set -euo pipefail
          grep -Fq 'pub mod git_diff;' source/packages/constants/src/lib.rs
          grep -Fq 'pub const GIT_DIFF_APPROXIMATE_MAX_TOKENS: usize = 10_000;' source/packages/constants/src/git_diff.rs
          grep -Fq 'pub const GIT_DIFF_CHARS_PER_TOKEN: usize = 4;' source/packages/constants/src/git_diff.rs
          grep -Fq 'GIT_DIFF_APPROXIMATE_MAX_TOKENS * GIT_DIFF_CHARS_PER_TOKEN;' source/packages/constants/src/git_diff.rs
          ! grep -Fq 'fn truncate_git_diff' source/packages/constants/src/git_diff.rs
          mapfile -t ANDROID_GIT_DIFF_SYMBOL_FILES < <(git grep -l -E 'GIT_DIFF_APPROXIMATE_MAX_TOKENS|GIT_DIFF_CHARS_PER_TOKEN|MAX_GIT_DIFF_CHAR_LENGTH|GIT_DIFF_INTRO|GIT_DIFF_UNCOMMITTED_INTRO|GIT_DIFF_TRUNCATION_NOTICE' -- source frontend mobile)
          printf '%s\n' "${ANDROID_GIT_DIFF_SYMBOL_FILES[@]}"
          test "${#ANDROID_GIT_DIFF_SYMBOL_FILES[@]}" -eq 1
          test "${ANDROID_GIT_DIFF_SYMBOL_FILES[0]}" = "source/packages/constants/src/git_diff.rs"
          DESKTOP_AUTHORITY_SHA="$(python3 - <<'PY2'
          import runpy
          print(runpy.run_path('scripts/android-port-docs.py')['EXPECTED_DESKTOP_COMMIT'])
          PY2
          )"
          DESKTOP_DIR="$RUNNER_TEMP/desktop-git-diff-authority"
          rm -rf "$DESKTOP_DIR"
          git init -q "$DESKTOP_DIR"
          git -C "$DESKTOP_DIR" remote add origin https://github.com/bhrumom/fabushi-desktop.git
          git -C "$DESKTOP_DIR" fetch -q --depth=1 origin "$DESKTOP_AUTHORITY_SHA"
          git -C "$DESKTOP_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD)" = "$DESKTOP_AUTHORITY_SHA"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/constants/git-diff.ts)" = "56fc62ac9910f1c56cb968e78d3c50e63ccbcc09"
          mapfile -t DESKTOP_GIT_DIFF_SYMBOL_FILES < <(git -C "$DESKTOP_DIR" grep -l -E 'GIT_DIFF_APPROXIMATE_MAX_TOKENS|GIT_DIFF_CHARS_PER_TOKEN|MAX_GIT_DIFF_CHAR_LENGTH|GIT_DIFF_INTRO|GIT_DIFF_UNCOMMITTED_INTRO|GIT_DIFF_TRUNCATION_NOTICE' -- .)
          printf '%s\n' "${DESKTOP_GIT_DIFF_SYMBOL_FILES[@]}"
          test "${#DESKTOP_GIT_DIFF_SYMBOL_FILES[@]}" -eq 2
          printf '%s\n' "${DESKTOP_GIT_DIFF_SYMBOL_FILES[@]}" | grep -Fxq 'source/packages/constants/git-diff.ts'
          printf '%s\n' "${DESKTOP_GIT_DIFF_SYMBOL_FILES[@]}" | grep -Fxq 'source/packages/agent/git-diff-processing.ts'
          grep -Fq 'buildGitDiffUncommittedUserContent' "$DESKTOP_DIR/source/packages/agent/context-processing-non-media-assembly.ts"
          grep -Fq 'selectedContext.gitDiff' "$DESKTOP_DIR/source/packages/agent/context-processing-non-media-assembly.ts"
          grep -Fq 'buildGitDiffUserContent' "$DESKTOP_DIR/source/packages/agent/context-processing-non-media-assembly.ts"
          grep -Fq 'selectedContext.gitDiffFromBranchToMain' "$DESKTOP_DIR/source/packages/agent/context-processing-non-media-assembly.ts"

      - name: Test exact-HEAD git-diff constants contract
        run: |
          set -euo pipefail
          cargo test -p fabushi-constants git_diff::tests::constants_match_desktop_git_diff_contract -- --exact


      - name: Verify exact-HEAD agent error recovery owner
        run: |
          set -euo pipefail
          DESKTOP_AUTHORITY_SHA="$(python3 - <<'PY'
          import runpy
          print(runpy.run_path('scripts/android-port-docs.py')['EXPECTED_DESKTOP_COMMIT'])
          PY
          )"
          DESKTOP_DIR="$RUNNER_TEMP/desktop-agent-error-authority"
          rm -rf "$DESKTOP_DIR"
          git init -q "$DESKTOP_DIR"
          git -C "$DESKTOP_DIR" remote add origin https://github.com/bhrumom/fabushi-desktop.git
          git -C "$DESKTOP_DIR" fetch -q --depth=1 origin "$DESKTOP_AUTHORITY_SHA"
          git -C "$DESKTOP_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD)" = "$DESKTOP_AUTHORITY_SHA"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/agent-client/errors.ts)" = "775c90dfd34f60b6efb10dab40247482af068a8a"
          grep -Fq 'Some("login".into())' source/host/src/extensions/transcript/agent_run_error.rs
          grep -Fq 'Some("upgrade".into())' source/host/src/extensions/transcript/agent_run_error.rs
          grep -Fq 'Some("payment".into())' source/host/src/extensions/transcript/agent_run_error.rs
          grep -Fq 'Some("config".into())' source/host/src/extensions/transcript/agent_run_error.rs
          grep -Fq '{"kind":"recovery-route","label":label,"route":action}' source/host/src/extensions/transcript/agent_run_error.rs
          grep -Fq 'route !in setOf("login", "upgrade", "payment", "config")' frontend/src/main/kotlin/com/ombhrum/fabushi/frontend/recovered/features/window-chrome/RootShellNotificationHost.kt
          grep -Fq '"login" -> model.beginBrowserLogin()' frontend/src/main/kotlin/com/ombhrum/fabushi/frontend/production/ProductionRenderer_view.kt
          grep -Fq '"upgrade", "payment" -> {' frontend/src/main/kotlin/com/ombhrum/fabushi/frontend/production/ProductionRenderer_view.kt
          grep -Fq 'model.refreshAccountUsageSummary()' frontend/src/main/kotlin/com/ombhrum/fabushi/frontend/production/ProductionRenderer_view.kt
          grep -Fq '"config" -> showSettings = true' frontend/src/main/kotlin/com/ombhrum/fabushi/frontend/production/ProductionRenderer_view.kt

      - name: Test exact-HEAD agent error recovery owner
        run: |
          set -euo pipefail
          cargo test -p fabushi-mahayana-host --test agent_run_error_contract
          (
            cd mobile/android
            ./gradlew testCiAcceptanceUnitTest --tests com.ombhrum.fabushi.RootShellNotificationHostTest
          )
          python -m unittest tests.test_root_shell_notification_host_wiring
          python -m unittest tests.test_android_port_docs_generator.AndroidPortDocsGeneratorTest.test_agent_run_error_mapping_uses_existing_rust_owner_and_strict_native_recovery_routes

      - name: Verify exact-HEAD git-repo-utils declaration owner
        run: |
          set -euo pipefail
          grep -Fq 'pub mod repo_label;' source/packages/constants/src/lib.rs
          grep -Fq 'pub fn extract_repo_name_from_git_url' source/packages/constants/src/repo_label.rs
          mapfile -t ANDROID_GIT_REPO_UTILS_OWNER_FILES < <(git grep -l -F 'extract_repo_name_from_git_url' -- source frontend mobile)
          printf '%s\n' "${ANDROID_GIT_REPO_UTILS_OWNER_FILES[@]}"
          test "${#ANDROID_GIT_REPO_UTILS_OWNER_FILES[@]}" -eq 1
          test "${ANDROID_GIT_REPO_UTILS_OWNER_FILES[0]}" = "source/packages/constants/src/repo_label.rs"
          DESKTOP_AUTHORITY_SHA="$(python3 - <<'PY2'
          import runpy
          print(runpy.run_path('scripts/android-port-docs.py')['EXPECTED_DESKTOP_COMMIT'])
          PY2
          )"
          DESKTOP_DIR="$RUNNER_TEMP/desktop-git-repo-utils-authority"
          rm -rf "$DESKTOP_DIR"
          git init -q "$DESKTOP_DIR"
          git -C "$DESKTOP_DIR" remote add origin https://github.com/bhrumom/fabushi-desktop.git
          git -C "$DESKTOP_DIR" fetch -q --depth=1 origin "$DESKTOP_AUTHORITY_SHA"
          git -C "$DESKTOP_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD)" = "$DESKTOP_AUTHORITY_SHA"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/agent-analytics/commit-scoring/git-repo-utils.ts)" = "6fb67136c110e5c36d7d1c25bd92220c950f717e"
          test "$(git -C "$DESKTOP_DIR" rev-parse HEAD:source/packages/agent/prompts/user-info-cloud-sections.ts)" = "579ffbf56f9d2359b355e5655135a94a71454474"
