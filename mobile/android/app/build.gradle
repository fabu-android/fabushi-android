plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.ombhrum.fabushi'
    compileSdk 37

    defaultConfig {
        applicationId 'com.ombhrum.fabushi'
        minSdk 26
        targetSdk 37
        versionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName = (project.findProperty('versionName') ?: '0.1.0').toString()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary true }
        buildConfigField 'boolean', 'GITHUB_UPDATES_ENABLED', 'false'
        buildConfigField 'boolean', 'CI_ACCOUNT_SESSION_IMPORT_ENABLED', 'false'
    }

    sourceSets {
        main.kotlin.srcDirs += [
            '../../../source/android-main/src/main/kotlin',
            '../../../source/android-preload/src/main/kotlin',
            '../../../frontend/src/main/kotlin'
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseKeystore) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        githubRelease {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'GITHUB_UPDATES_ENABLED', 'true'
            buildConfigField 'boolean', 'CI_ACCOUNT_SESSION_IMPORT_ENABLED', 'false'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
        ciAcceptance {
            initWith debug
            applicationIdSuffix '.ci'
            versionNameSuffix '-ci'
            matchingFallbacks = ['debug']
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField 'boolean', 'GITHUB_UPDATES_ENABLED', 'false'
            buildConfigField 'boolean', 'CI_ACCOUNT_SESSION_IMPORT_ENABLED', 'true'
        }
    }

    testBuildType 'ciAcceptance'

    testOptions {
        unitTests.returnDefaultValues = true
        animationsDisabled = true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.android.billingclient:billing-ktx:9.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.json:json:20250517'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
