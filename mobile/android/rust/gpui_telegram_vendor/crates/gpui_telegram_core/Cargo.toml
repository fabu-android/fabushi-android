[package]
name = "gpui_telegram_core"
version = "1.2.0"
edition = "2021"
description = "Platform-agnostic domain models, MTProto/E2EE primitives, and Quad-Export Action Bus from bhrum/gpui-telegram"

[features]
default = []
inherited-messaging = []

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
cipher = { version = "0.4", features = ["block-padding"] }
futures = "0.3"
hmac = "0.12"
rand = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
