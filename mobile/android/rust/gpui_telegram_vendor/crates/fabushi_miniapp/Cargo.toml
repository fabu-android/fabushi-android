[package]
name = "fabushi_miniapp"
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Pure-Rust shared Mini App core for Global Dharma Offering & Zen Room"

[features]
default = []
sqlite = ["dep:rusqlite", "dep:chrono", "dep:uuid"]
server = ["sqlite"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
