[package]
name = "mahayana-js-runtime"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
mahayana-plugin-runtime = { path = "../mahayana-plugin-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rquickjs = { version = "0.12.2", default-features = false, features = ["std", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.12.2", default-features = false, features = ["std", "loader", "bindgen"] }

[dev-dependencies]
tempfile = "3"
