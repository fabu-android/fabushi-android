[package]
name = "fabushi-android-local-exec-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fabushi-android-shared = { path = "../shared" }

[lib]
path = "src/lib.rs"
