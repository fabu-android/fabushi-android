[package]
name = "fabushi-mahayana-host"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
default = []
ci-account-session-import = []

[dependencies]
base64 = "0.22"
fabushi-android-shared = { path = "../shared" }
fabushi-constants = { path = "../packages/constants" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
url = "2"

[lib]
path = "src/lib.rs"
