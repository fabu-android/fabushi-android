[package]
name = "fabushi-mahayana-host"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
default = []
ci-account-session-import = []

[dependencies]
libc = "0.2"
base64 = "0.22"
ed25519-dalek = "=2.2.0"
chrono = "0.4"
chrono-tz = "0.10"
fabushi-android-shared = { path = "../shared" }
fabushi-android-box-exec-daemon = { path = "../box-exec-daemon" }
fabushi-android-local-exec-daemon = { path = "../local-exec-daemon" }
fabushi-constants = { path = "../packages/constants" }
fabushi-android-mcp-core = { path = "../packages/mcp-core" }
fabushi-android-agent-kv = { path = "../packages/agent-kv" }
futures = "0.3"
fs2 = "0.4"
notify = "8.2.0"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
regex = "1"
mahayana-plugin-runtime = { path = "../packages/mahayana-plugin-runtime" }
mahayana-js-runtime = { path = "../packages/mahayana-js-runtime" }
mahayana-miniapp-protocol = { path = "../packages/mahayana-miniapp-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.12", features = ["json"] }
url = "2"
unicode-normalization = "0.1"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
