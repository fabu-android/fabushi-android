[package]
name = "fabushi-mahayana-host"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
default = []
ci-account-session-import = []

[dependencies]
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
fabushi-android-shared = { path = "../shared" }
fabushi-android-box-exec-daemon = { path = "../box-exec-daemon" }
fabushi-android-local-exec-daemon = { path = "../local-exec-daemon" }
fabushi-constants = { path = "../packages/constants" }
futures = "0.3"
fs2 = "0.4"
mahayana-plugin-runtime = { path = "../packages/mahayana-plugin-runtime" }
mahayana-js-runtime = { path = "../packages/mahayana-js-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
url = "2"
unicode-normalization = "0.1"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
