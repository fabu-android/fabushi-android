[package]
name = "fabushi-android-box-exec-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fabushi-android-shared = { path = "../shared" }
fabushi-constants = { path = "../packages/constants" }
fs2 = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
url = "2"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
